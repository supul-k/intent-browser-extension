<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Intent</h1>
      <div id="current-session">
        <h2>Current Session</h2>
        <p>Time on current site: <span id="current-site-time">0s</span></p>
      </div>

      <div id="intention-section">
        <h2>Set Intention</h2>
        <input
          type="text"
          id="intention-input"
          placeholder="What's your intention?"
        />
        <button id="set-intention">Set</button>
      </div>

      <div id="quick-stats">
        <h3>Today</h3>
        <p>Focus time: <span id="focus-time">0m</span></p>
        <p>Distraction time: <span id="distraction-time">0m</span></p>
      </div>

      <footer>
        <a href="#" id="open-options">Settings</a>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
