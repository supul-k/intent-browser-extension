<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>🧘 Intent</h1>
    
    <div id="current-intention-panel" class="panel">
      <h3>Current Intention</h3>
      <div id="current-intention-display" class="intention-display">
        Not set
      </div>
    </div>
    
    <div id="intention-section" class="panel">
      <h3>Set Intention</h3>
      <input type="text" id="intention-input" placeholder="e.g., 'Deep work for 1 hour'">
      <button id="set-intention">Set</button>
      
      <div class="quick-intentions">
        <button class="quick-intention" data-intention="Deep work">🎯 Deep work</button>
        <button class="quick-intention" data-intention="Learning">📚 Learning</button>
        <button class="quick-intention" data-intention="Relax">😌 Relax</button>
      </div>
    </div>
    
    <div id="stats-panel" class="panel">
      <div class="panel-header">
        <h3>Today</h3>
        <button id="refresh-stats" class="icon-button">↻</button>
      </div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Focus time</span>
          <span class="stat-value" id="focus-time">0m</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Distraction time</span>
          <span class="stat-value" id="distraction-time">0m</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Interruptions</span>
          <span class="stat-value" id="interruptions">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Resisted</span>
          <span class="stat-value" id="resisted">0</span>
        </div>
      </div>
    </div>
    
    <div id="status-message" class="status" style="display: none;"></div>
    
    <footer>
      <a href="#" id="open-options">Settings</a>
    </footer>
  </div>
  <script src="../popup.js"></script>
</body>
</html>
